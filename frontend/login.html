<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Student Login - Student Study Planner</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link rel="stylesheet" href="css/styles.css">
  <link rel="stylesheet" href="css/auth.css">
  <link rel="stylesheet" href="css/responsive.css">
</head>
<body class="auth-body">

  <div class="auth-wrapper">
    <div class="auth-card">
      <div class="auth-header">
        <a href="index.html" class="brand-logo auth-logo">
          <div class="brand-icon">
            <i class="fa-solid fa-graduation-cap"></i>
          </div>
          <div class="brand-title">
            <span class="title-main">StudyPulse</span>
            <span class="title-sub">Planner & Tracker</span>
          </div>
        </a>
        <h2 class="auth-title">Welcome Back</h2>
        <p class="auth-subtitle">Sign in to your student study dashboard</p>
      </div>

      <!-- Quick Demo Login Box (Ideal for evaluators / viva!) -->
      <div class="demo-login-box">
        <p><i class="fa-solid fa-lightbulb"></i> Evaluating or testing this project?</p>
        <button type="button" id="demo-login-btn" class="btn btn-outline-primary btn-sm" style="width: 100%; background: #fff;">
          <i class="fa-solid fa-wand-magic-sparkles"></i> Try Demo Student Account (Instant Access)
        </button>
      </div>

      <div class="auth-divider">
        <span>Or sign in with email</span>
      </div>

      <form id="login-form">
        <div class="form-group">
          <label class="form-label" for="email">Student Email Address</label>
          <div style="position: relative;">
            <input type="email" id="email" class="form-control" placeholder="name@college.edu" required />
          </div>
        </div>

        <div class="form-group">
          <label class="form-label" for="password">Password</label>
          <div style="position: relative;">
            <input type="password" id="password" class="form-control" placeholder="Enter your password" required />
            <button type="button" class="toggle-password-btn" style="position: absolute; right: 12px; top: 50%; transform: translateY(-50%); background: none; border: none; color: #94A3B8; cursor: pointer;">
              <i class="fa-solid fa-eye"></i>
            </button>
          </div>
        </div>

        <button type="submit" class="btn btn-primary" style="width: 100%; margin-top: 10px; padding: 12px;">
          Sign In to Dashboard <i class="fa-solid fa-arrow-right"></i>
        </button>
      </form>

      <div class="auth-footer">
        Don't have an account yet? <a href="register.html">Register here</a>
      </div>
    </div>
  </div>

  <div id="toast-container"></div>

  <script src="js/api.js"></script>
  <script src="js/auth.js"></script>
</body>
</html>
