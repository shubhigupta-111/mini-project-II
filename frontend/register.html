<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Student Registration - Student Study Planner</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link rel="stylesheet" href="css/styles.css">
  <link rel="stylesheet" href="css/auth.css">
  <link rel="stylesheet" href="css/responsive.css">
</head>
<body class="auth-body">

  <div class="auth-wrapper">
    <div class="auth-card" style="max-width: 500px;">
      <div class="auth-header">
        <a href="index.html" class="brand-logo auth-logo">
          <div class="brand-icon">
            <i class="fa-solid fa-graduation-cap"></i>
          </div>
          <div class="brand-title">
            <span class="title-main">StudyPulse</span>
            <span class="title-sub">Planner & Tracker</span>
          </div>
        </a>
        <h2 class="auth-title">Create Account</h2>
        <p class="auth-subtitle">Join thousands of students mastering their study routine</p>
      </div>

      <form id="register-form">
        <div class="form-group">
          <label class="form-label" for="name">Full Name *</label>
          <input type="text" id="name" class="form-control" placeholder="e.g. Alex Johnson" required />
        </div>

        <div class="form-group">
          <label class="form-label" for="email">Student Email Address *</label>
          <input type="email" id="email" class="form-control" placeholder="e.g. alex@college.edu" required />
        </div>

        <div class="form-row">
          <div class="form-group">
            <label class="form-label" for="college">College / University</label>
            <input type="text" id="college" class="form-control" placeholder="e.g. Apex Tech Institute" />
          </div>
          <div class="form-group">
            <label class="form-label" for="major">Major / Branch</label>
            <input type="text" id="major" class="form-control" placeholder="e.g. Computer Science" />
          </div>
        </div>

        <div class="form-group">
          <label class="form-label" for="semester">Current Academic Semester</label>
          <select id="semester" class="form-control">
            <option value="Semester 1">Semester 1</option>
            <option value="Semester 2">Semester 2</option>
            <option value="Semester 3">Semester 3</option>
            <option value="Semester 4">Semester 4</option>
            <option value="Semester 5" selected>Semester 5</option>
            <option value="Semester 6">Semester 6</option>
            <option value="Semester 7">Semester 7</option>
            <option value="Semester 8">Semester 8</option>
          </select>
        </div>

        <div class="form-row">
          <div class="form-group">
            <label class="form-label" for="password">Password *</label>
            <div style="position: relative;">
              <input type="password" id="password" class="form-control" placeholder="Min 6 characters" required />
              <button type="button" class="toggle-password-btn" style="position: absolute; right: 10px; top: 50%; transform: translateY(-50%); background: none; border: none; color: #94A3B8; cursor: pointer;">
                <i class="fa-solid fa-eye"></i>
              </button>
            </div>
          </div>
          <div class="form-group">
            <label class="form-label" for="confirmPassword">Confirm Password *</label>
            <div style="position: relative;">
              <input type="password" id="confirmPassword" class="form-control" placeholder="Re-enter password" required />
            </div>
          </div>
        </div>

        <button type="submit" class="btn btn-primary" style="width: 100%; margin-top: 10px; padding: 12px;">
          Create Student Account <i class="fa-solid fa-arrow-right"></i>
        </button>
      </form>

      <div class="auth-footer">
        Already have an account? <a href="login.html">Sign In</a>
      </div>
    </div>
  </div>

  <div id="toast-container"></div>

  <script src="js/api.js"></script>
  <script src="js/auth.js"></script>
</body>
</html>
