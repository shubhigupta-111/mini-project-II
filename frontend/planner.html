<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Study Planner - Student Study Planner</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link rel="stylesheet" href="css/styles.css">
  <link rel="stylesheet" href="css/responsive.css">
</head>
<body>

  <div class="app-container">
    <!-- Sidebar -->
    <aside class="sidebar" id="sidebar">
      <div class="sidebar-header">
        <a href="dashboard.html" class="brand-logo">
          <div class="brand-icon">
            <i class="fa-solid fa-graduation-cap"></i>
          </div>
          <div class="brand-title">
            <span class="title-main">StudyPulse</span>
            <span class="title-sub">Planner & Tracker</span>
          </div>
        </a>
        <button class="close-sidebar-btn" id="close-sidebar-btn">
          <i class="fa-solid fa-xmark"></i>
        </button>
      </div>

      <nav class="sidebar-nav">
        <span class="nav-section-label">Academic Workspace</span>
        <a href="dashboard.html" class="nav-link">
          <i class="fa-solid fa-gauge-high"></i>
          <span>Dashboard</span>
        </a>
        <a href="subjects.html" class="nav-link">
          <i class="fa-solid fa-book-open"></i>
          <span>My Subjects</span>
        </a>
        <a href="planner.html" class="nav-link active">
          <i class="fa-solid fa-list-check"></i>
          <span>Study Planner</span>
        </a>
        <a href="calendar.html" class="nav-link">
          <i class="fa-solid fa-calendar-days"></i>
          <span>Calendar</span>
        </a>
        <a href="progress.html" class="nav-link">
          <i class="fa-solid fa-chart-pie"></i>
          <span>Progress Tracker</span>
        </a>
        <a href="goals.html" class="nav-link">
          <i class="fa-solid fa-bullseye"></i>
          <span>Goals & Reminders</span>
        </a>

        <span class="nav-section-label">Account</span>
        <a href="profile.html" class="nav-link">
          <i class="fa-solid fa-user-gear"></i>
          <span>Profile & Settings</span>
        </a>
      </nav>

      <div class="sidebar-footer">
        <div class="user-profile-widget">
          <div class="user-avatar" id="sidebar-user-avatar">AL</div>
          <div class="user-info">
            <div class="user-name" id="sidebar-user-name">Alex Johnson</div>
            <div class="user-sub" id="sidebar-user-college">B.Tech CSE</div>
          </div>
          <button class="logout-icon-btn logout-btn" title="Logout">
            <i class="fa-solid fa-arrow-right-from-bracket"></i>
          </button>
        </div>
      </div>
    </aside>

    <!-- Main Wrapper -->
    <div class="main-wrapper">
      <header class="topbar">
        <div class="topbar-left">
          <button class="mobile-menu-toggle" id="mobile-menu-btn">
            <i class="fa-solid fa-bars"></i>
          </button>
          <div>
            <h1 class="page-title">Daily Study Planner</h1>
            <p class="page-subtitle">Schedule tasks, prioritize assignments, and track your study backlog</p>
          </div>
        </div>

        <div class="topbar-right">
          <button class="topbar-btn topbar-btn-primary" onclick="openAddTaskModal()">
            <i class="fa-solid fa-plus"></i>
            <span>Add Study Task</span>
          </button>
        </div>
      </header>

      <main class="page-content">
        <!-- Search & Filter Control Bar -->
        <div class="planner-filters-bar">
          <div class="planner-filters-group">
            <div class="planner-search-box">
              <i class="fa-solid fa-magnifying-glass"></i>
              <input type="text" id="task-search" class="form-control" placeholder="Search tasks & topics..." />
            </div>

            <select id="filter-subject" class="filter-select">
              <option value="all">All Subjects</option>
            </select>

            <select id="filter-priority" class="filter-select">
              <option value="all">All Priorities</option>
              <option value="High">High Priority</option>
              <option value="Medium">Medium Priority</option>
              <option value="Low">Low Priority</option>
            </select>

            <select id="filter-status" class="filter-select">
              <option value="all">All Statuses</option>
              <option value="Pending">Pending</option>
              <option value="Completed">Completed</option>
              <option value="Overdue">Overdue</option>
            </select>
          </div>

          <div style="display: flex; align-items: center; gap: 12px;">
            <button id="reset-filters-btn" class="btn btn-secondary btn-sm" title="Clear all filters">
              <i class="fa-solid fa-rotate-left"></i> Reset
            </button>
            <span style="font-size: 0.85rem; font-weight: 700; color: var(--text-muted);">
              <span id="planner-task-count">0</span> Tasks
            </span>
          </div>
        </div>

        <!-- Task List Container -->
        <div id="tasks-container">
          <!-- Populated dynamically -->
        </div>
      </main>
    </div>
  </div>

  <!-- Add / Edit Study Task Modal -->
  <div class="modal-overlay" id="taskModal">
    <div class="modal-content">
      <div class="modal-header">
        <h3 class="modal-title" id="task-modal-title">Add Study Task</h3>
        <button class="modal-close-btn">&times;</button>
      </div>
      <form id="task-form">
        <div class="modal-body">
          <div class="form-group">
            <label class="form-label" for="task-title">Task Title *</label>
            <input type="text" id="task-title" class="form-control" placeholder="e.g. Solve LeetCode Top 50 BFS Questions" required />
          </div>

          <div class="form-group">
            <label class="form-label" for="task-subject">Subject *</label>
            <select id="task-subject" class="form-control" required>
              <option value="">-- Choose Subject --</option>
            </select>
          </div>

          <div class="form-row">
            <div class="form-group">
              <label class="form-label" for="task-due-date">Due Date *</label>
              <input type="date" id="task-due-date" class="form-control" required />
            </div>
            <div class="form-group">
              <label class="form-label" for="task-due-time">Due Time</label>
              <input type="time" id="task-due-time" class="form-control" value="23:59" />
            </div>
          </div>

          <div class="form-row">
            <div class="form-group">
              <label class="form-label" for="task-priority">Priority</label>
              <select id="task-priority" class="form-control">
                <option value="High">High</option>
                <option value="Medium" selected>Medium</option>
                <option value="Low">Low</option>
              </select>
            </div>
            <div class="form-group">
              <label class="form-label" for="task-hours">Estimated Study Hours</label>
              <input type="number" id="task-hours" class="form-control" value="2" min="0.5" max="24" step="0.5" />
            </div>
          </div>

          <div class="form-group">
            <label class="form-label" for="task-desc">Task Notes & Instructions</label>
            <textarea id="task-desc" class="form-control" placeholder="Reference textbook chapters, lecture slides, formulas, or assignment links..."></textarea>
          </div>
        </div>

        <div class="modal-footer">
          <button type="button" class="btn btn-secondary btn-close-modal">Cancel</button>
          <button type="submit" class="btn btn-primary">Save Task</button>
        </div>
      </form>
    </div>
  </div>

  <div id="toast-container"></div>

  <script src="js/api.js"></script>
  <script src="js/planner.js"></script>
</body>
</html>
